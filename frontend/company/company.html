<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公司详情</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=kline-adjust-20260820" />
</head>
<body class="company-page-root">
  <div class="app company-page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">SW</span>
        <div>
          <h1 id="pageTitle">公司详情</h1>
          <p id="pageSub">指标详情 · 行情走势 · 交易所公告 · 巨潮公告 · 七报七网 · 官方新闻 · 其他新闻 · 机构研报</p>
        </div>
      </div>
      <div class="top-actions">
        <a id="backLink" class="btn ghost" href="/">返回列表</a>
        <button id="refreshNewsBtn" class="btn ghost" type="button">刷新最新</button>
      </div>
    </header>

    <section class="company-hero">
      <div class="company-hero-identity">
        <p id="companyBreadcrumb" class="breadcrumb">-</p>
        <div class="company-hero-title-row">
          <h2 id="companyName">-</h2>
          <span id="companyCodeChip" class="company-code-chip"></span>
        </div>
      </div>
      <div class="company-hero-stats">
        <div id="quoteStrip" class="quote-strip"></div>
        <div id="metricsPanels" class="company-metrics-panels">
          <div id="metricsGrid" class="company-metrics"></div>
        </div>
      </div>
    </section>

    <section class="company-section chart-section" aria-label="行情走势">
      <div class="section-head chart-section-head">
        <h3>行情走势</h3>
        <div class="chart-head-controls">
          <div id="chartTabs" class="chart-tabs" role="tablist" aria-label="周期">
            <button type="button" class="chart-tab is-active" data-mode="day" role="tab" aria-selected="true">日K</button>
            <button type="button" class="chart-tab" data-mode="week" role="tab" aria-selected="false">周K</button>
            <button type="button" class="chart-tab" data-mode="month" role="tab" aria-selected="false">月K</button>
            <button type="button" class="chart-tab" data-mode="intraday" role="tab" aria-selected="false">分时</button>
            <button type="button" class="chart-tab" data-mode="intraday5" role="tab" aria-selected="false">五日</button>
            <button type="button" class="chart-tab" data-mode="1m" role="tab" aria-selected="false">1分</button>
            <button type="button" class="chart-tab" data-mode="5m" role="tab" aria-selected="false">5分</button>
            <button type="button" class="chart-tab" data-mode="15m" role="tab" aria-selected="false">15分</button>
            <button type="button" class="chart-tab" data-mode="30m" role="tab" aria-selected="false">30分</button>
            <button type="button" class="chart-tab" data-mode="60m" role="tab" aria-selected="false">60分</button>
          </div>
          <div id="chartAdjust" class="chart-adjust" role="group" aria-label="复权">
            <button type="button" class="chart-adjust-btn is-active" data-adjust="qfq" aria-pressed="true">前复权</button>
            <button type="button" class="chart-adjust-btn" data-adjust="none" aria-pressed="false">不复权</button>
          </div>
        </div>
      </div>
      <div class="chart-toolbar">
        <p id="chartMeta" class="muted chart-meta">加载中…</p>
        <div id="chartHoverCard" class="chart-hover-card hidden" aria-hidden="true"></div>
      </div>
      <div id="chartWrap" class="chart-canvas-wrap">
        <canvas id="priceChart" width="960" height="360" aria-label="价格走势图"></canvas>
        <p id="chartEmpty" class="muted chart-empty hidden">暂无走势数据</p>
      </div>
      <div id="chartAxisScroll" class="chart-axis-scroll is-disabled">
        <input
          id="chartScrollBar"
          class="chart-scroll-bar"
          type="range"
          min="0"
          max="0"
          value="0"
          step="1"
          aria-label="时间轴滑动"
          disabled
        />
      </div>
    </section>

    <section class="company-section news-section" data-kind="exchange">
      <div class="section-head">
        <h3>交易所公告</h3>
        <p class="muted news-section-meta" data-meta="exchange"></p>
      </div>
      <div class="company-news-body" data-body="exchange" tabindex="0">
        <div class="news-list" data-list="exchange">
          <p class="muted">正在加载最新…</p>
        </div>
        <p class="muted news-scroll-hint" data-hint="exchange"></p>
      </div>
    </section>

    <section class="company-section news-section" data-kind="cninfo">
      <div class="section-head">
        <h3>巨潮公告</h3>
        <p class="muted news-section-meta" data-meta="cninfo"></p>
      </div>
      <div class="company-news-body" data-body="cninfo" tabindex="0">
        <div class="news-list" data-list="cninfo">
          <p class="muted">正在加载最新…</p>
        </div>
        <p class="muted news-scroll-hint" data-hint="cninfo"></p>
      </div>
    </section>

    <section class="company-section news-section" data-kind="designated_press">
      <div class="section-head">
        <h3>七报七网</h3>
        <p class="muted news-section-meta" data-meta="designated_press"></p>
      </div>
      <div class="company-news-body" data-body="designated_press" tabindex="0">
        <div class="news-list" data-list="designated_press">
          <p class="muted">正在加载最新…</p>
        </div>
        <p class="muted news-scroll-hint" data-hint="designated_press"></p>
      </div>
    </section>

    <section class="company-section news-section" data-kind="official_news">
      <div class="section-head">
        <h3>官方新闻</h3>
        <p class="muted news-section-meta" data-meta="official_news"></p>
      </div>
      <div class="company-news-body" data-body="official_news" tabindex="0">
        <div class="news-list" data-list="official_news">
          <p class="muted">正在加载最新…</p>
        </div>
        <p class="muted news-scroll-hint" data-hint="official_news"></p>
      </div>
    </section>

    <section class="company-section news-section" data-kind="other_news">
      <div class="section-head">
        <h3>其他新闻</h3>
        <p class="muted news-section-meta" data-meta="other_news"></p>
      </div>
      <div class="company-news-body" data-body="other_news" tabindex="0">
        <div class="news-list" data-list="other_news">
          <p class="muted">正在加载最新…</p>
        </div>
        <p class="muted news-scroll-hint" data-hint="other_news"></p>
      </div>
    </section>

    <section class="company-section news-section" data-kind="reports">
      <div class="section-head">
        <h3>机构研报</h3>
        <p class="muted news-section-meta" data-meta="reports"></p>
      </div>
      <div class="company-news-body" data-body="reports" tabindex="0">
        <div class="news-list" data-list="reports">
          <p class="muted">正在加载最新…</p>
        </div>
        <p class="muted news-scroll-hint" data-hint="reports"></p>
      </div>
    </section>

    <div id="errorBox" class="error hidden"></div>
  </div>

  <script src="/js/company.js?v=quote-no-fflow-20260820"></script>
</body>
</html>
