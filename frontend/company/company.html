<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公司详情</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app company-page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">SW</span>
        <div>
          <h1 id="pageTitle">公司详情</h1>
          <p id="pageSub">指标详情 · 公司公告 · 外部新闻 · 机构研报</p>
        </div>
      </div>
      <div class="top-actions">
        <a id="backLink" class="btn ghost" href="/">返回列表</a>
        <button id="refreshNewsBtn" class="btn ghost" type="button">刷新资讯</button>
      </div>
    </header>

    <section class="company-hero">
      <div>
        <p id="companyBreadcrumb" class="breadcrumb">-</p>
        <h2 id="companyName">-</h2>
        <p id="companyMeta" class="muted"></p>
      </div>
      <div id="quoteStrip" class="quote-strip"></div>
    </section>

    <section class="company-section">
      <div class="section-head">
        <h3>详细指标</h3>
      </div>
      <div id="metricsGrid" class="stock-detail company-metrics"></div>
    </section>

    <section class="company-section">
      <div class="section-head">
        <h3>资讯与研报</h3>
        <p id="newsMeta" class="muted"></p>
      </div>
      <div id="newsBody" class="company-news-groups">
        <p class="muted">正在加载…</p>
      </div>
    </section>

    <div id="errorBox" class="error hidden"></div>
  </div>

  <script src="/js/company.js"></script>
</body>
</html>
