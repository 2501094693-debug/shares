<!DOCTYPE html>
<html lang="zh-CN" class="app-shell-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORBIT · 行业行情</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=market-history-20260912" />
</head>
<body class="app-shell company-page-root market-page-root" data-nav="market">
  <nav class="app-rail" id="appRail" aria-label="主导航"></nav>

  <div class="app-stage">
    <div class="app company-page market-page">
      <header class="topbar company-topbar">
        <div class="brand">
          <div>
            <h1>行业行情</h1>
            <p class="company-page-sub" id="marketSub">一级 → 二级 → 三级 → 成分股，每张表按涨跌排序</p>
          </div>
        </div>
        <div class="top-actions">
          <div class="market-date-nav">
            <button id="prevDateBtn" class="btn ghost" type="button" aria-label="前一日">‹</button>
            <input id="dateInput" class="market-date" type="date" aria-label="行情日期" />
            <button id="nextDateBtn" class="btn ghost" type="button" aria-label="后一日">›</button>
            <button id="todayBtn" class="btn ghost" type="button">今天</button>
          </div>
          <button id="refreshBtn" class="btn ghost" type="button">刷新</button>
        </div>
      </header>

      <div class="market-toolbar">
        <div id="summaryBar" class="market-summary"></div>
        <div class="market-toolbar-tail">
          <span id="liveDot" class="market-live" data-state="idle">LIVE</span>
          <span id="marketMeta" class="muted market-meta"></span>
        </div>
      </div>

      <div id="errorBox" class="error hidden"></div>
      <div id="loading" class="loading hidden">正在加载…</div>

      <div class="market-board">
        <section class="market-pane" data-level="1">
          <header class="market-pane-head">
            <h2>一级行业</h2>
            <span id="l1Hint" class="market-pane-hint">按涨跌</span>
          </header>
          <div class="market-pane-scroll">
            <table class="market-table">
              <thead>
                <tr>
                  <th>名称</th>
                  <th class="num">涨跌</th>
                  <th class="num market-col-live">涨(停)</th>
                  <th class="num market-col-live">跌(停)</th>
                  <th class="num market-col-live">今日</th>
                  <th class="num market-col-live">5日</th>
                  <th class="num market-col-live">10日</th>
                  <th class="num market-col-hist">收盘</th>
                  <th class="num market-col-hist">换手</th>
                  <th class="num market-col-hist">PE</th>
                  <th class="num market-col-hist">PB</th>
                </tr>
              </thead>
              <tbody id="l1Body"></tbody>
            </table>
          </div>
        </section>
        <section class="market-pane" data-level="2">
          <header class="market-pane-head">
            <h2>二级行业</h2>
            <span id="l2Hint" class="market-pane-hint">点一级后展开</span>
          </header>
          <div class="market-pane-scroll">
            <table class="market-table">
              <thead>
                <tr>
                  <th>名称</th>
                  <th class="num">涨跌</th>
                  <th class="num market-col-live">涨(停)</th>
                  <th class="num market-col-live">跌(停)</th>
                  <th class="num market-col-live">今日</th>
                  <th class="num market-col-live">5日</th>
                  <th class="num market-col-live">10日</th>
                  <th class="num market-col-hist">收盘</th>
                  <th class="num market-col-hist">换手</th>
                  <th class="num market-col-hist">PE</th>
                  <th class="num market-col-hist">PB</th>
                </tr>
              </thead>
              <tbody id="l2Body"></tbody>
            </table>
          </div>
        </section>
        <section class="market-pane" data-level="3">
          <header class="market-pane-head">
            <h2>三级行业</h2>
            <span id="l3Hint" class="market-pane-hint">点二级后展开</span>
          </header>
          <div class="market-pane-scroll">
            <table class="market-table">
              <thead>
                <tr>
                  <th>名称</th>
                  <th class="num">涨跌</th>
                  <th class="num market-col-live">涨(停)</th>
                  <th class="num market-col-live">跌(停)</th>
                  <th class="num market-col-live">今日</th>
                  <th class="num market-col-live">5日</th>
                  <th class="num market-col-live">10日</th>
                  <th class="num market-col-hist">收盘</th>
                  <th class="num market-col-hist">换手</th>
                  <th class="num market-col-hist">PE</th>
                  <th class="num market-col-hist">PB</th>
                </tr>
              </thead>
              <tbody id="l3Body"></tbody>
            </table>
          </div>
        </section>
        <section class="market-pane" data-level="4">
          <header class="market-pane-head">
            <h2>成分股</h2>
            <span id="l4Hint" class="market-pane-hint">点三级后展开</span>
          </header>
          <div class="market-pane-scroll">
            <table class="market-table">
              <thead>
                <tr>
                  <th>名称</th>
                  <th class="num">涨跌</th>
                  <th class="num">PE</th>
                  <th class="num">PB</th>
                  <th class="num market-col-live">今日</th>
                  <th class="num market-col-live">5日</th>
                  <th class="num market-col-live">10日</th>
                </tr>
              </thead>
              <tbody id="l4Body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="/js/shared/orbit-http.js?v=market-history-20260912"></script>
  <script src="/js/shared/orbit-prefetch.js?v=cn-fund-unify-20260912"></script>
  <script src="/js/shared/nav.js?v=judgment-after-fund-20260912"></script>
  <script src="/js/market.js?v=market-sealed-20260912"></script>
</body>
</html>
