<!DOCTYPE html>
<html lang="zh-CN" class="app-shell-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORBIT · 智能分析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=orbit-shell-20260902" />
  <link rel="stylesheet" href="/css/ai-page.css?v=ai-page-20260909b" />
</head>
<body class="app-shell ai-page-root" data-nav="ai">
  <nav class="app-rail" aria-label="主导航">
    <a class="app-rail-brand" href="/" title="ORBIT 申万终端">
      <span class="app-rail-mark">OR</span>
      <span class="app-rail-word">ORBIT</span>
    </a>
    <div class="app-rail-links">
      <a class="app-rail-link" href="/" data-nav="industry" title="行业树">
        <span class="app-rail-ico" aria-hidden="true">◈</span>
        <span>行业树</span>
      </a>
      <a class="app-rail-link" href="/market" data-nav="market" title="行情">
        <span class="app-rail-ico" aria-hidden="true">▣</span>
        <span>行情</span>
      </a>
      <a class="app-rail-link" href="/fund" data-nav="fund" title="场内基金">
        <span class="app-rail-ico" aria-hidden="true">◎</span>
        <span>场内</span>
      </a>
      <a class="app-rail-link" href="/otc-fund" data-nav="otc-fund" title="场外基金">
        <span class="app-rail-ico" aria-hidden="true">◍</span>
        <span>场外</span>
      </a>
      <a class="app-rail-link" href="/steep" data-nav="steep" title="涨跌停">
        <span class="app-rail-ico" aria-hidden="true">↕</span>
        <span>涨跌停</span>
      </a>
      <a class="app-rail-link" href="/screen" data-nav="screen" title="形态筛选">
        <span class="app-rail-ico" aria-hidden="true">⬡</span>
        <span>形态</span>
      </a>
      <a class="app-rail-link" href="/list" data-nav="list" title="龙虎榜">
        <span class="app-rail-ico" aria-hidden="true">≡</span>
        <span>龙虎榜</span>
      </a>
      <a class="app-rail-link" href="/ai" data-nav="ai" title="智能分析 · 业务 / 财报 / 竞争 / 风险">
        <span class="app-rail-ico" aria-hidden="true">◉</span>
        <span>分析</span>
      </a>
    </div>
  </nav>

  <div class="app-stage">
    <div class="app ai-page">
      <header class="topbar ai-topbar">
        <div class="ai-topbar-grid">
          <div class="brand">
            <div>
              <h1 id="pageHeading">智能分析</h1>
              <p id="pageSubtitle" class="company-page-sub">业务简述 · 财报简述 · 行业竞争 · 风险评估</p>
              <nav class="ai-brief-modes" aria-label="分析类型" role="tablist">
                <button type="button" class="ai-brief-mode is-active" data-mode="business" role="tab" aria-selected="true">业务简述</button>
                <button type="button" class="ai-brief-mode" data-mode="earnings" role="tab" aria-selected="false">财报简述</button>
                <button type="button" class="ai-brief-mode" data-mode="competition" role="tab" aria-selected="false">行业竞争</button>
                <button type="button" class="ai-brief-mode" data-mode="risk" role="tab" aria-selected="false">风险评估</button>
              </nav>
            </div>
          </div>
          <div class="top-actions">
            <span id="liveDot" class="market-live hidden" data-state="idle"></span>
          </div>
        </div>
        <div class="ai-command-row">
          <div class="ai-command-main">
            <div class="ai-search-wrap">
              <label class="search-box ai-search-box">
                <span class="sr-only">公司</span>
                <input id="companyInput" type="search" placeholder="公司名或代码，如 600519" autocomplete="off" />
              </label>
              <div id="suggestBox" class="ai-suggest-dropdown hidden" role="listbox"></div>
            </div>
          </div>
          <div class="ai-command-tail">
            <span id="jobMeta" class="ai-job-meta muted"></span>
            <button id="startBtn" class="btn primary" type="button">生成</button>
            <button id="stopPollBtn" class="btn ghost hidden" type="button">停止轮询</button>
          </div>
        </div>
      </header>

      <div id="errorBox" class="error hidden"></div>

      <div id="aiBoard" class="ai-board is-idle">
        <aside class="ai-pane ai-pane-history" aria-label="历史报告">
          <header class="ai-pane-head">
            <h2 id="historyHead">历史报告</h2>
            <button id="refreshReportsBtn" class="btn ghost sm" type="button">刷新</button>
          </header>
          <div class="ai-pane-scroll">
            <ul id="reportList" class="ai-history-list"></ul>
          </div>
        </aside>

        <main class="ai-pane ai-pane-report" aria-label="分析报告">
          <header class="ai-pane-head ai-report-head">
            <div class="ai-report-title-block">
              <h2 id="reportTitle">分析报告</h2>
              <p id="reportMeta" class="muted">选择历史报告或生成新的</p>
            </div>
            <div class="ai-report-tools">
              <span id="reportStatus" class="ai-status-chip hidden" aria-live="polite"></span>
            </div>
          </header>

          <div class="ai-pane-scroll ai-report-scroll">
            <article id="reportView" class="ai-report-body"></article>
          </div>
        </main>

        <aside class="ai-pane ai-pane-monitor" id="progressPanel" aria-label="生成进度">
          <header class="ai-pane-head">
            <h2>生成流水线</h2>
            <span id="pipelineProgress" class="ai-pane-hint">0 / 5</span>
          </header>
          <div id="currentAction" class="ai-run-banner hidden" aria-live="polite">
            <span class="ai-run-banner-label">进行中</span>
            <strong id="currentAgent"></strong>
            <span id="currentMessage" class="ai-run-banner-msg"></span>
          </div>
          <div class="ai-pane-scroll ai-pipeline-scroll">
            <div id="agentBoard" class="ai-pipeline"></div>
          </div>
          <header class="ai-pane-subhead">
            <h3>实时日志</h3>
          </header>
          <div class="ai-pane-scroll ai-log-scroll">
            <ol id="activityLog" class="ai-activity-log"></ol>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script src="/js/shared/nav.js?v=ai-page-20260909"></script>
  <script src="/js/ai/modes.js?v=ai-unified-20260909"></script>
  <script src="/js/ai.js?v=ai-unified-20260909"></script>
</body>
</html>
