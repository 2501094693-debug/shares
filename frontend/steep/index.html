<!DOCTYPE html>
<html lang="zh-CN" class="app-shell-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORBIT · 涨跌停</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=steep-fullbleed-20260903" />
</head>
<body class="app-shell company-page-root market-page-root steep-page-root" data-nav="steep">
  <nav class="app-rail" aria-label="主导航">
    <a class="app-rail-brand" href="/" title="ORBIT 申万终端">
      <span class="app-rail-mark">OR</span>
      <span class="app-rail-word">ORBIT</span>
    </a>
    <div class="app-rail-links">
      <a class="app-rail-link" href="/" data-nav="industry" title="行业树 · 地图与分类">
        <span class="app-rail-ico" aria-hidden="true">◈</span>
        <span>行业树</span>
      </a>
      <a class="app-rail-link" href="/market" data-nav="market" title="行业行情 · 涨跌与资金">
        <span class="app-rail-ico" aria-hidden="true">▣</span>
        <span>行情</span>
      </a>
      <a class="app-rail-link" href="/fund" data-nav="fund" title="场内基金 · ETF / LOF">
        <span class="app-rail-ico" aria-hidden="true">◎</span>
        <span>基金</span>
      </a>
      <a class="app-rail-link" href="/steep" data-nav="steep" title="涨跌停 · 多日名单">
        <span class="app-rail-ico" aria-hidden="true">↕</span>
        <span>涨跌停</span>
      </a>
      <a class="app-rail-link" href="/list" data-nav="list" title="龙虎榜 · 席位明细">
        <span class="app-rail-ico" aria-hidden="true">≡</span>
        <span>龙虎榜</span>
      </a>
    </div>
  </nav>

  <div class="app-stage">
    <div class="app company-page market-page steep-page">
      <header class="topbar company-topbar">
        <div class="brand">
          <div>
            <h1>涨跌停</h1>
            <p class="company-page-sub">多日并排：点左侧可折叠涨停或跌停，另一排铺满；点日期向右展开名单</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" class="btn ghost" type="button">刷新</button>
        </div>
      </header>

      <div class="market-toolbar">
        <div id="summaryBar" class="market-summary"></div>
        <div class="market-toolbar-tail">
          <div id="sortSeg" class="market-seg steep-sort" role="group" aria-label="排序">
            <button type="button" data-sort="board">连板</button>
            <button type="button" data-sort="l1">一级</button>
          </div>
          <div id="rangeSeg" class="market-seg steep-range" role="group" aria-label="天数">
            <button type="button" data-days="15">15日</button>
            <button type="button" data-days="30">30日</button>
          </div>
          <span id="liveDot" class="market-live" data-state="idle">LIVE</span>
          <span id="marketMeta" class="muted market-meta"></span>
        </div>
      </div>

      <div id="errorBox" class="error hidden"></div>
      <div id="loading" class="loading hidden">正在加载…</div>

      <div class="steep-matrix">
        <section class="steep-matrix-row" data-kind="up" id="upRow">
          <button type="button" class="steep-matrix-label" data-tone="up" data-kind="up" aria-expanded="true" title="折叠涨停">
            <span>涨停</span>
            <span class="steep-row-caret" aria-hidden="true">▾</span>
          </button>
          <div class="steep-matrix-scroll" id="upScroll">
            <div class="steep-matrix-track" id="upTrack"></div>
          </div>
        </section>
        <section class="steep-matrix-row" data-kind="down" id="downRow">
          <button type="button" class="steep-matrix-label" data-tone="down" data-kind="down" aria-expanded="true" title="折叠跌停">
            <span>跌停</span>
            <span class="steep-row-caret" aria-hidden="true">▾</span>
          </button>
          <div class="steep-matrix-scroll" id="downScroll">
            <div class="steep-matrix-track" id="downTrack"></div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="/js/shared/nav.js?v=orbit-shell-20260902"></script>
  <script src="/js/steep.js?v=orbit-shell-20260902"></script>
</body>
</html>
