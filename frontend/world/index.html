<!DOCTYPE html>
<html lang="zh-CN" class="app-shell-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORBIT · 全球市场</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://webapi.amap.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=world-rates-20260928" />
</head>
<body class="app-shell world-page-root" data-nav="world">
  <div class="app-stage world-stage">
    <div class="world-map-wrap">
      <div id="mapStage" class="world-map-stage" role="application" aria-label="全球市场地图"></div>
      <div class="world-map-controls">
        <p id="worldStatus" class="world-map-status muted" data-state="">同步中…</p>
        <p id="worldOilStatus" class="world-map-status muted" hidden data-state="">同步中…</p>
        <div class="world-view-toggle" role="group" aria-label="地图图层">
          <button type="button" class="btn ghost world-layer-btn" data-layer="all" aria-pressed="false">全部</button>
          <button type="button" class="btn ghost world-layer-btn" data-layer="indices" aria-pressed="false">指数</button>
          <button type="button" class="btn ghost world-layer-btn is-active" data-layer="oil" aria-pressed="true">原油</button>
          <button type="button" class="btn ghost world-layer-btn" data-layer="bonds" aria-pressed="false">国债</button>
          <button type="button" class="btn ghost world-layer-btn" data-layer="rates" aria-pressed="false">利率</button>
        </div>
        <div class="world-view-toggle" role="group" aria-label="底图类型">
          <button type="button" class="btn ghost world-view-btn is-active" data-view="roadmap" aria-pressed="true">标准</button>
          <button type="button" class="btn ghost world-view-btn" data-view="satellite" aria-pressed="false">卫星</button>
        </div>
      </div>
      <aside id="worldChartPop" class="world-chart-pop" hidden></aside>
    </div>
  </div>
  <script src="/js/shared/orbit-http.js?v=prefetch-20260912"></script>
  <script src="/js/shared/orbit-prefetch.js?v=world-rates-20260928"></script>
  <script src="/js/shared/kline-draw.js?v=world-novol-20260927b"></script>
  <script src="/js/world.js?v=world-oil-default-20260928"></script>
</body>
</html>
