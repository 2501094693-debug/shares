<!DOCTYPE html>
<html lang="zh-CN" class="app-shell-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORBIT · 行情研判</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=select-20261014f" />
</head>
<body class="app-shell company-page-root market-page-root screen-page-root" data-nav="analysis" data-screen-mode="industry">
  <nav class="app-rail" id="appRail" aria-label="主导航"></nav>

  <div class="app-stage">
    <div class="app company-page market-page screen-page analysis-page">
      <header class="topbar company-topbar">
        <div class="brand">
          <div>
            <h1>行情研判</h1>
            <p class="company-page-sub" id="pageSub">按交易日复盘申万三级行业轮动：上涨/待涨/领涨均按所选交易日切片；行情与主力净流入（当日/5日/10日）回溯至该日。点击行业进入行情树</p>
          </div>
        </div>
        <div class="top-actions">
          <div id="viewSeg" class="market-seg judgment-view" role="tablist" aria-label="研判类型">
            <button type="button" data-view="industry" class="is-active" role="tab" aria-selected="true">行业分析</button>
            <button type="button" data-view="shares" role="tab" aria-selected="false">个股分析</button>
            <button type="button" data-view="select" role="tab" aria-selected="false">股票分析</button>
            <button type="button" data-view="limit" role="tab" aria-selected="false">涨跌停分析</button>
          </div>
          <button id="refreshBtn" class="btn ghost" type="button">重新分析</button>
        </div>
      </header>

      <div class="market-toolbar">
        <div id="summaryBar" class="market-summary"></div>
        <div class="market-toolbar-tail">
          <span id="liveDot" class="market-live" data-state="idle">IDLE</span>
          <span id="marketMeta" class="muted market-meta"></span>
          <label class="search-box analysis-code-box judgment-query">
            <span class="sr-only">股票代码</span>
            <input id="codeInput" type="search" placeholder="代码，留空全市场" maxlength="8" autocomplete="off" />
          </label>
          <div id="limitDaysSeg" class="market-seg screen-range judgment-limit" role="group" aria-label="回看窗口">
            <button type="button" data-days="15" class="is-active">15日</button>
            <button type="button" data-days="30">30日</button>
          </div>
          <div id="limitTopSeg" class="market-seg screen-range judgment-limit" role="group" aria-label="显示数量">
            <button type="button" data-top="30" class="is-active">每日Top30</button>
            <button type="button" data-top="50">每日Top50</button>
            <button type="button" data-top="0">全部</button>
          </div>
          <div id="sharesTopSeg" class="market-seg screen-range judgment-shares" role="group" aria-label="显示数量">
            <button type="button" data-top="50" class="is-active">Top50</button>
            <button type="button" data-top="100">Top100</button>
            <button type="button" data-top="0">全部</button>
          </div>
          <button id="sharesClearBtn" class="btn ghost judgment-shares" type="button" title="清空已设条件">清空条件</button>
          <div id="industryDaysSeg" class="market-seg screen-range judgment-industry" role="group" aria-label="回看窗口">
            <button type="button" data-days="20" class="is-active">近一个月</button>
            <button type="button" data-days="60">近三个月</button>
            <button type="button" data-days="120">近半年</button>
            <button type="button" data-days="245">一年</button>
            <button type="button" data-days="490">两年</button>
          </div>
        </div>
      </div>

      <div id="errorBox" class="error hidden"></div>
      <div id="loading" class="loading screen-progress hidden">正在分析…</div>

      <section id="selectPanel" class="select-panel hidden" aria-label="股票分析">
        <div class="select-cards">
          <div class="select-card">
            <div class="select-card-head">
              <h3>输入筛选 · 时间窗</h3>
              <div class="sel-presets" role="group" aria-label="常用区间">
                <button type="button" data-range="30">近1月</button>
                <button type="button" data-range="90">近3月</button>
                <button type="button" data-range="180">近半年</button>
                <button type="button" data-range="365" class="is-active">近1年</button>
              </div>
            </div>
            <div class="select-field"><span>价格区间</span><span class="select-dates"><input id="selPxStart" type="date" /><i>–</i><input id="selPxEnd" type="date" /></span></div>
            <div class="select-field"><span>目标日</span><input id="selPxTarget" type="date" /></div>
            <div class="select-field"><span>排名方向</span><select id="selPxOrder">
              <option value="desc" selected>从大到小（1 = 最高）</option>
              <option value="asc">从小到大（1 = 最低）</option>
            </select></div>
          </div>
          <div class="select-card">
            <div class="select-card-head"><h3>输出筛选 · 分位过滤</h3><label class="sel-toggle"><input id="selOnlyPass" type="checkbox" checked />只看通过</label></div>
            <div class="select-filters">
            <div class="select-field"><span>开盘</span><span class="select-dates"><input id="selFOpenMin" type="number" step="1" min="0" max="100" placeholder="最小" /><i>–</i><input id="selFOpenMax" type="number" step="1" min="0" max="100" placeholder="最大" /></span></div>
            <div class="select-field"><span>最高</span><span class="select-dates"><input id="selFHighMin" type="number" step="1" min="0" max="100" placeholder="最小" /><i>–</i><input id="selFHighMax" type="number" step="1" min="0" max="100" placeholder="最大" /></span></div>
            <div class="select-field"><span>最低</span><span class="select-dates"><input id="selFLowMin" type="number" step="1" min="0" max="100" placeholder="最小" /><i>–</i><input id="selFLowMax" type="number" step="1" min="0" max="100" placeholder="最大" /></span></div>
            <div class="select-field"><span>收盘</span><span class="select-dates"><input id="selFCloseMin" type="number" step="1" min="0" max="100" placeholder="最小" /><i>–</i><input id="selFCloseMax" type="number" step="1" min="0" max="100" placeholder="最大" /></span></div>
            </div>
            <div class="select-quick" role="group" aria-label="收盘快捷">
              <span>收盘快捷：</span>
              <button type="button" data-q="high">高位≥80</button>
              <button type="button" data-q="mid">中位40–70</button>
              <button type="button" data-q="low">低位≤20</button>
              <button type="button" data-q="clear">清除</button>
            </div>
          </div>
        </div>
        <div class="select-actions">
          <button id="selRunBtn" class="btn primary" type="button">开始全市场扫描</button>
          <button id="selStopBtn" class="btn ghost hidden" type="button">停止</button>
          <button id="selResetBtn" class="btn ghost" type="button">重置过滤</button>
          <span id="selMeta" class="muted"></span>
          <strong id="selPassCount" class="sel-pass-count"></strong>
        </div>
        <div id="selProgress" class="sel-progress hidden" aria-label="扫描进度">
          <div class="sel-progress-bar"><i id="selProgressFill"></i></div>
          <span id="selProgressText" class="muted">准备中…</span>
        </div>
        <div id="selError" class="error hidden"></div>
        <div id="selResult" class="screen-result-list sel-cards"><p class="screen-empty muted">设置时间窗与分位后开始全市场扫描，符合的结果会实时出现</p></div>
      </section>

      <div class="screen-layout">
        <div id="sharesWorkbench" class="shares-workbench judgment-shares-panel hidden">
          <div id="sharesExprBar" class="shares-expr-bar" aria-label="筛选式"></div>
          <div id="sharesPresetBar" class="shares-preset-pop" aria-label="筛选方案" hidden></div>
        </div>
        <nav id="dayRail" class="screen-day-rail" aria-label="交易日"></nav>
        <div id="sharesBenchBody" class="shares-bench-body judgment-shares-panel hidden">
          <div id="sharesCondPanel" class="shares-cond-panel" aria-label="本日条件"></div>
        </div>
        <div class="screen-day-main">
          <div id="dayHead" class="screen-day-head"></div>
          <div id="resultList" class="screen-result-list">
            <p class="screen-empty muted">加载中…</p>
          </div>
        </div>
      </div>

      <div class="rot-board judgment-industry-board">
        <section class="rot-pane" data-kind="days">
          <header class="rot-pane-head">
            <h2>交易日</h2>
            <span id="rotDaysHint" class="rot-pane-hint"></span>
          </header>
          <nav id="rotDayRail" class="rot-days" aria-label="交易日"></nav>
        </section>
        <section class="rot-pane" data-kind="again">
          <header class="rot-pane-head">
            <h2 id="rotAgainTitle">上涨</h2>
            <span id="rotAgainHint" class="rot-pane-hint"></span>
          </header>
          <div class="rot-scroll">
            <table class="rot-table">
              <thead>
                <tr>
                  <th>三级行业</th>
                  <th class="num">次数</th>
                  <th class="num">得分</th>
                  <th class="num">当日</th>
                  <th class="num" title="上涨家数 / 样本">广度</th>
                  <th class="num" title="按市值门槛统计的强势股：权重大票≥2%，题材仍接近涨停">强势</th>
                </tr>
              </thead>
              <tbody id="indAgainBody"></tbody>
            </table>
          </div>
        </section>
        <section class="rot-pane" data-kind="wait">
          <header class="rot-pane-head">
            <h2 id="rotWaitTitle">待涨</h2>
            <span id="rotWaitHint" class="rot-pane-hint"></span>
          </header>
          <div class="rot-scroll">
            <table class="rot-table">
              <thead>
                <tr>
                  <th>三级行业</th>
                  <th class="num">次数</th>
                  <th class="num">距上次</th>
                  <th class="num">涨跌</th>
                  <th class="num">涨(停)</th>
                  <th class="num">跌(停)</th>
                  <th class="num">今日</th>
                  <th class="num">5日</th>
                  <th class="num">10日</th>
                </tr>
              </thead>
              <tbody id="indWaitBody"></tbody>
            </table>
          </div>
        </section>
        <section class="rot-pane" data-kind="rank">
          <header class="rot-pane-head">
            <h2>领涨</h2>
            <span id="indRankHint" class="rot-pane-hint"></span>
          </header>
          <div class="rot-scroll">
            <table class="rot-table">
              <thead>
                <tr>
                  <th>三级行业</th>
                  <th class="num">次数</th>
                  <th class="num">上次</th>
                </tr>
              </thead>
              <tbody id="indRankBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="/js/shared/orbit-http.js?v=prefetch-20260912"></script>
  <script src="/js/shared/orbit-prefetch.js?v=futures-20260923"></script>
  <script src="/js/shared/nav.js?v=nav-industry-20261001"></script>
  <script src="/js/shared/kline-draw.js?v=screen-20260909-kpan"></script>
  <script src="/js/analysis.js?v=shares-lower-shadow-20260929"></script>
  <script src="/js/analysis-select.js?v=select-20261014g"></script>
</body>
</html>
