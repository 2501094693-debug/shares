<!DOCTYPE html>
<html lang="zh-CN" class="app-shell-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORBIT · 行情研判</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=20261124-mode-seg" />
</head>
<body class="app-shell company-page-root market-page-root screen-page-root analysis-page" data-nav="analysis" data-screen-mode="industry">
  <nav class="app-rail" id="appRail" aria-label="主导航"></nav>

  <div class="app-stage">
    <div class="app company-page market-page screen-page analysis-page">
      <header class="topbar company-topbar">
        <div class="brand">
          <div>
            <h1>行情研判</h1>
            <p class="company-page-sub" id="pageSub">按交易日复盘申万三级行业轮动：上涨/待涨/领涨均按所选交易日切片；行情与主力净流入（当日/5日/10日）回溯至该日。点击行业进入行情树</p>
          </div>
        </div>
        <div class="top-actions">
          <div id="modeSeg" class="market-seg analysis-mode-seg" role="tablist" aria-label="研判模式">
            <button type="button" id="modeIndustryBtn" data-mode="industry" class="is-active" role="tab" aria-selected="true">行业轮动</button>
            <button type="button" id="modeShareBtn" data-mode="shares" role="tab" aria-selected="false">个股分析</button>
          </div>
          <button id="refreshBtn" class="btn ghost" type="button">重新分析</button>
        </div>
      </header>

      <div class="market-toolbar">
        <div id="summaryBar" class="market-summary"></div>
        <div class="market-toolbar-tail">
          <span id="liveDot" class="market-live" data-state="idle">IDLE</span>
          <span id="marketMeta" class="muted market-meta"></span>
          <div id="industryDaysSeg" class="market-seg screen-range judgment-industry" role="group" aria-label="回看窗口">
            <button type="button" data-days="20" class="is-active">近一个月</button>
            <button type="button" data-days="60">近三个月</button>
            <button type="button" data-days="120">近半年</button>
            <button type="button" data-days="245">一年</button>
            <button type="button" data-days="490">两年</button>
          </div>
        </div>
      </div>

      <!-- 行业轮动（原有） -->
      <div class="rot-board judgment-industry-board" id="rotBoard">
        <section class="rot-pane" data-kind="days">
          <header class="rot-pane-head">
            <h2>交易日</h2>
            <span id="rotDaysHint" class="rot-pane-hint"></span>
          </header>
          <nav id="rotDayRail" class="rot-days" aria-label="交易日"></nav>
        </section>
        <section class="rot-pane" data-kind="again">
          <header class="rot-pane-head">
            <h2 id="rotAgainTitle">上涨</h2>
            <span id="rotAgainHint" class="rot-pane-hint"></span>
          </header>
          <div class="rot-scroll">
            <table class="rot-table">
              <thead>
                <tr>
                  <th>三级行业</th>
                  <th class="num">次数</th>
                  <th class="num">得分</th>
                  <th class="num">当日</th>
                  <th class="num" title="上涨家数 / 样本">广度</th>
                  <th class="num" title="按市值门槛统计的强势股：权重大票≥2%，题材仍接近涨停">强势</th>
                </tr>
              </thead>
              <tbody id="indAgainBody"></tbody>
            </table>
          </div>
        </section>
        <section class="rot-pane" data-kind="wait">
          <header class="rot-pane-head">
            <h2 id="rotWaitTitle">待涨</h2>
            <span id="rotWaitHint" class="rot-pane-hint"></span>
          </header>
          <div class="rot-scroll">
            <table class="rot-table">
              <thead>
                <tr>
                  <th>三级行业</th>
                  <th class="num">次数</th>
                  <th class="num">距上次</th>
                  <th class="num">涨跌</th>
                  <th class="num">涨(停)</th>
                  <th class="num">跌(停)</th>
                  <th class="num">今日</th>
                  <th class="num">5日</th>
                  <th class="num">10日</th>
                </tr>
              </thead>
              <tbody id="indWaitBody"></tbody>
            </table>
          </div>
        </section>
        <section class="rot-pane" data-kind="rank">
          <header class="rot-pane-head">
            <h2>领涨</h2>
            <span id="indRankHint" class="rot-pane-hint"></span>
          </header>
          <div class="rot-scroll">
            <table class="rot-table">
              <thead>
                <tr>
                  <th>三级行业</th>
                  <th class="num">次数</th>
                  <th class="num">上次</th>
                </tr>
              </thead>
              <tbody id="indRankBody"></tbody>
            </table>
          </div>
        </section>
      </div>

      <!-- 个股分析（区间回测，参照涨跌停左右分栏） -->
      <div class="judgment-shares" id="sharesView">
        <div class="judgment-shares-panel">
          <header class="judgment-shares-head">
            <h2>个股分析 · 区间回测</h2>
            <span class="judgment-shares-hint" id="sharesHint"></span>
          </header>
          <div class="judgment-shares-toolbar">
            <label class="field">
              <span class="field-label">起始日</span>
              <input type="date" id="shareStartDate" class="field-input" />
            </label>
            <label class="field">
              <span class="field-label">截止日</span>
              <input type="date" id="shareEndDate" class="field-input" />
            </label>
            <label class="field">
              <span class="field-label">MACD</span>
              <select id="shareMacdSelect" class="field-input" aria-label="MACD 参数">
                <option value="10,20,7">10 / 20 / 7</option>
                <option value="12,26,9">12 / 26 / 9</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label">排序</span>
              <select id="shareSortSelect" class="field-input" aria-label="股票列表排序">
                <option value="default">默认顺序</option>
                <option value="max_close_gain_desc">最大收盘涨幅降序</option>
                <option value="max_close_drop_desc">最大收盘跌幅降序</option>
              </select>
            </label>
            <button type="button" id="shareRefreshBtn" class="btn">开始分析</button>
          </div>
          <div id="shareErrorBox" class="error hidden"></div>
          <div id="shareLoading" class="loading hidden">正在分析…</div>
          <aside class="judgment-shares-dates" aria-label="交易日列表">
            <div class="judgment-shares-dates-head">交易日</div>
            <div class="judgment-shares-dates-scroll" id="shareDateList" role="listbox" aria-label="选择交易日"></div>
          </aside>
        </div>

        <div class="judgment-shares-body">
          <section class="judgment-shares-row" data-kind="near">
            <button type="button" class="judgment-shares-label" data-kind="near" aria-expanded="true" title="折叠即将水下金叉">
              <span>即将水下金叉</span>
              <span class="judgment-shares-row-count">0</span>
            </button>
            <div class="judgment-shares-pane-scroll">
              <table class="share-table">
                <thead>
                  <tr>
                    <th>股票</th>
                    <th>相对缺口</th>
                    <th>相对速度</th>
                    <th>稳定区间</th>
                    <th class="num">反向日</th>
                    <th>收盘价低点</th>
                    <th>最低价低点</th>
                    <th>后期涨跌</th>
                  </tr>
                </thead>
                <tbody id="shareNearBody"></tbody>
              </table>
            </div>
          </section>
          <section class="judgment-shares-row" data-kind="under">
            <button type="button" class="judgment-shares-label" data-kind="under" aria-expanded="true" title="折叠水下金叉">
              <span>水下金叉</span>
              <span class="judgment-shares-row-count">0</span>
            </button>
            <div class="judgment-shares-pane-scroll">
              <table class="share-table">
                <thead>
                  <tr>
                    <th>股票</th>
                    <th>相对缺口</th>
                    <th>相对速度</th>
                    <th>稳定区间</th>
                    <th class="num">反向日</th>
                    <th>收盘价低点</th>
                    <th>最低价低点</th>
                    <th>后期涨跌</th>
                  </tr>
                </thead>
                <tbody id="shareUnderBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>

      <div id="errorBox" class="error hidden"></div>
      <div id="loading" class="loading screen-progress hidden">正在分析…</div>
    </div>
  </div>
  <script src="/js/shared/orbit-http.js?v=prefetch-20260912"></script>
  <script src="/js/shared/orbit-prefetch.js?v=futures-20260923"></script>
  <script src="/js/shared/nav.js?v=20261123-industry-only"></script>
  <script src="/js/analysis.js?v=20261125-macd-preset"></script>
</body>
</html>
