<!DOCTYPE html>
<html lang="zh-CN" class="app-shell-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORBIT · 形态筛选</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=screen-20260909" />
</head>
<body class="app-shell company-page-root market-page-root screen-page-root" data-nav="screen">
  <nav class="app-rail" aria-label="主导航">
    <a class="app-rail-brand" href="/" title="ORBIT 申万终端">
      <span class="app-rail-mark">OR</span>
      <span class="app-rail-word">ORBIT</span>
    </a>
    <div class="app-rail-links">
      <a class="app-rail-link" href="/" data-nav="industry" title="行业树 · 地图与分类">
        <span class="app-rail-ico" aria-hidden="true">◈</span>
        <span>行业树</span>
      </a>
      <a class="app-rail-link" href="/market" data-nav="market" title="行业行情 · 涨跌与资金">
        <span class="app-rail-ico" aria-hidden="true">▣</span>
        <span>行情</span>
      </a>
      <a class="app-rail-link" href="/fund" data-nav="fund" title="场内基金 · ETF / LOF">
        <span class="app-rail-ico" aria-hidden="true">◎</span>
        <span>场内</span>
      </a>
      <a class="app-rail-link" href="/otc-fund" data-nav="otc-fund" title="场外基金 · 开放式">
        <span class="app-rail-ico" aria-hidden="true">◍</span>
        <span>场外</span>
      </a>
      <a class="app-rail-link" href="/steep" data-nav="steep" title="涨跌停 · 多日名单">
        <span class="app-rail-ico" aria-hidden="true">↕</span>
        <span>涨跌停</span>
      </a>
      <a class="app-rail-link" href="/screen" data-nav="screen" title="形态筛选 · 阴跌横盘涨停">
        <span class="app-rail-ico" aria-hidden="true">⬡</span>
        <span>形态</span>
      </a>
      <a class="app-rail-link" href="/list" data-nav="list" title="龙虎榜 · 席位明细">
        <span class="app-rail-ico" aria-hidden="true">≡</span>
        <span>龙虎榜</span>
      </a>
      <a class="app-rail-link" href="/ai" data-nav="ai" title="智能分析 · 业务 / 财报 / 竞争 / 风险">
        <span class="app-rail-ico" aria-hidden="true">◉</span>
        <span>分析</span>
      </a>
    </div>
  </nav>

  <div class="app-stage">
    <div class="app company-page market-page screen-page">
      <header class="topbar company-topbar">
        <div class="brand">
          <div>
            <h1>形态筛选</h1>
            <p class="company-page-sub">阴跌 → 横盘 → 涨停：近期涨停为硬条件，其余维度软评分排序</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" class="btn ghost" type="button">重新分析</button>
        </div>
      </header>

      <div class="market-toolbar">
        <div id="summaryBar" class="market-summary"></div>
        <div class="market-toolbar-tail">
          <div id="daysSeg" class="market-seg screen-range" role="group" aria-label="涨停窗口">
            <button type="button" data-days="15">15日</button>
            <button type="button" data-days="30">30日</button>
          </div>
          <div id="topSeg" class="market-seg screen-range" role="group" aria-label="显示数量">
            <button type="button" data-top="30">Top30</button>
            <button type="button" data-top="50">Top50</button>
            <button type="button" data-top="100">Top100</button>
          </div>
          <span id="liveDot" class="market-live" data-state="idle">IDLE</span>
          <span id="marketMeta" class="muted market-meta"></span>
        </div>
      </div>

      <div id="errorBox" class="error hidden"></div>
      <div id="loading" class="loading hidden">正在分析…</div>

      <div class="screen-pane market-pane" data-level="1">
        <table class="market-table screen-table" id="resultTable">
          <thead>
            <tr>
              <th class="num">#</th>
              <th>名称</th>
              <th class="num">总分</th>
              <th class="num">阴跌天</th>
              <th class="num">横盘天</th>
              <th class="num">阴跌%</th>
              <th class="num">横盘幅%</th>
              <th class="num">涨停日</th>
              <th class="num">板</th>
              <th class="num screen-score-col">阴跌时长</th>
              <th class="num screen-score-col">阴跌质量</th>
              <th class="num screen-score-col">横盘时长</th>
              <th class="num screen-score-col">横盘质量</th>
              <th class="num screen-score-col">突破</th>
              <th class="num screen-score-col">结构</th>
            </tr>
          </thead>
          <tbody id="resultBody">
            <tr class="is-empty"><td colspan="16">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="/js/shared/nav.js?v=orbit-shell-20260909"></script>
  <script src="/js/screen.js?v=screen-20260909"></script>
</body>
</html>
